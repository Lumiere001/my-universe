# master 에 push 하면 이미지 3개를 GHCR 에 올린다(2차 가이드 ⑥ 패키징). 인증은 GITHUB_TOKEN 만(PAT 없음).
#   ghcr.io/lumiere001/my-universe-backend    ← Dockerfile
#   ghcr.io/lumiere001/my-universe-frontend   ← infra/frontend/Dockerfile
#   ghcr.io/lumiere001/my-universe-chroma     ← infra/chroma/Dockerfile
# 태그는 latest · sha-<커밋 7자리>. 받아 띄우기: docker-compose.ghcr.yml (README.md "GHCR 이미지").
# 화면 이미지에 박히는 값(없어도 빌드됨): 저장소 변수 DOCKER_API_BASE · SUPABASE_URL, 비밀 SUPABASE_ANON_KEY.
name: ghcr

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]   # 문서만 바뀐 push 는 이미지가 같으니 건너뛴다(Actions 시간 아끼기)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 연달아 push 하면 앞 실행을 멈추고 마지막 것만 → latest 가 늘 마지막 커밋
concurrency: { group: ghcr, cancel-in-progress: true }

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, file: Dockerfile }
          - { name: frontend, file: infra/frontend/Dockerfile }
          - { name: chroma, file: infra/chroma/Dockerfile }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1   # type=gha 캐시에 필요
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그 + OCI 라벨(org.opencontainers.image.source = 이 저장소 → 패키지가 저장소에 붙는다)
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/lumiere001/my-universe-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 화면 Dockerfile 만 쓰는 값(브라우저에 박히는 공개 값). 다른 두 Dockerfile 에는 이 ARG 가 없어 쓰이지 않는다.
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.DOCKER_API_BASE || 'http://localhost:8001' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
