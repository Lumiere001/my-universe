<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1e1e">
<title>연결이 끊겼어요 · 나의 우주</title>
<style>
  html, body { margin: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #1e1e1e; color: #dadada;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.6; word-break: keep-all; }
  .card { max-width: 420px; background: #262626; border: 1px solid #363636; border-radius: 8px; padding: 24px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: #a3a3a3; margin: 0 0 16px; }
  button { font: inherit; font-weight: 700; color: #fff; background: #8b6cef; border: 0; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; }
</style>
</head>
<body>
<main class="card">
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>나의 우주는 연결되어 있어야 일기를 쓰고 볼 수 있어요. 연결되면 다시 열어 주세요.</p>
  <button onclick="location.reload()">다시 열기</button>
</main>
</body>
</html>
