<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 나의 우주 아이콘: 밤하늘 + 해(삶의 영역) + 궤도를 도는 행성(기록). 꽉 찬 사각형이라 maskable 로도 쓴다(그림은 가운데 안전 영역 안). -->
  <defs>
    <radialGradient id="sky" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1d4596"/>
      <stop offset=".55" stop-color="#0d1a3f"/>
      <stop offset="1" stop-color="#07102a"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset=".55" stop-color="#fcd679"/>
      <stop offset="1" stop-color="#d9a12e"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fcd679" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fcd679" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#e8eefc">
    <circle cx="118" cy="126" r="5"/><circle cx="392" cy="104" r="6"/><circle cx="420" cy="388" r="4"/>
    <circle cx="138" cy="392" r="4"/><circle cx="300" cy="78" r="3"/><circle cx="84" cy="270" r="3"/>
  </g>
  <circle cx="256" cy="256" r="130" fill="url(#glow)"/>
  <g transform="rotate(-18 256 256)" fill="none" stroke="#b9a6ff" stroke-width="10" stroke-linecap="round">
    <path d="M86 256A170 60 0 0 1 426 256" opacity=".55"/>
  </g>
  <circle cx="256" cy="256" r="74" fill="url(#sun)"/>
  <g transform="rotate(-18 256 256)">
    <path d="M86 256A170 60 0 0 0 426 256" fill="none" stroke="#b9a6ff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="403" cy="286" r="26" fill="#ffa184" stroke="#07102a" stroke-width="6"/>
  </g>
</svg>
