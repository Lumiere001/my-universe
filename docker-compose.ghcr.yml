# 빌드 대신 GHCR 이미지로 띄우기(.github/workflows/main.yml 이 master push 마다 올림). 먼저 docker login ghcr.io.
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#   끄기: scripts/stop_docker.sh
# build 를 지워서(!reset) 받기에 실패하면 로컬 빌드로 넘어가지 않고 멈춘다.
# 이미지는 GitHub 러너(amd64)에서 만든다 → Apple Silicon 맥은 Docker Desktop 이 에뮬레이션으로 돌린다(platform).
services:
  chroma:
    image: ghcr.io/lumiere001/my-universe-chroma:latest
    platform: linux/amd64
  backend:
    image: ghcr.io/lumiere001/my-universe-backend:latest
    build: !reset null
    platform: linux/amd64
  frontend:
    image: ghcr.io/lumiere001/my-universe-frontend:latest
    build: !reset null
    platform: linux/amd64
