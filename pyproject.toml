[project]
name = "my-universe"
version = "0.8.0"
description = "나의 우주 — 말을 거는 일기장 (v8 · 10/17 판 백엔드)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.6",
    "openai>=1.99.0",
    "python-dotenv>=1.1.0",
    "chromadb-client>=1.0",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
